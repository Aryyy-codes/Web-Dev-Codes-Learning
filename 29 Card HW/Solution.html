<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Making</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: azure;
        }

        .box {
            box-sizing: border-box;
            background-color: rgb(249, 250, 250);
            margin: 8px auto;
            padding: 8px;
            width: 45vmin;
            height: auto;
            border: 2px solid rgb(176, 176, 176);
            border-radius: 15px;
            position: relative;
        }

        img {
            border: 2px solid rgb(0, 0, 0);
            border-radius: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .box2 {
            border: 2px solid rgb(93, 142, 170);
            border-radius: 15px;
            padding: 4px;
            margin: 4px;
            color: rgb(82, 128, 174);
            display: inline-block;
            font-size: 0.8rem;
        }

        .box3 {
            padding: 1px;
            font-size: 1.2rem;
        }

        .box4 {
            padding: 4px;
        }

        .box5 {
            background-color: rgb(175, 219, 245);
            color: rgb(1, 84, 122);
            /* border: 2px solid rgb(148, 206, 239); */
            border-radius: 15px;
            font-size: 0.8rem;
            padding: 8px 12px;
            display: block;
            margin: 4px auto;
            width: 56px;
        }

        .box4 p {
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="box1">
            <img width="100%" src="Image.jpg" alt="Card Image">
        </div>

        <div class="box2">
            Peoples
            <!-- <a href="https://www.aryanmishra.me"> Web </a> -->
        </div>

        <div class="box2">
            Identity
            <!-- <a href="https://www.aryanmishra.me"> Web </a> -->
        </div>

        <div class="box3">
            <h2>
                Aryan Mishra
            </h2>
        </div>

        <div class="box4">
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum. Lorem ipsum dolor sit amet consectetur, adipisicing elit. 
            </p>
        </div>

        <div class="box5">
                Read more 
        </div>

    </div>
</body>

</html>
