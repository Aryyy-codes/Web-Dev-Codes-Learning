<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Introduction</title>
    <style>
        div, h5{
            color: rgb(120, 174, 255);
            font-size: 20px;
            font-family: Arial;
        }
        h3 {
            color: rgb(124, 142, 20);
            font-size: 18px;
            font-family: cursive;
        }
    </style>
</head> 
<body>
    <div> Hey ! This is Aryan and today we will learn about CSS. </div>
    <h3> The div and h5 used in CSS is the selector for selecting div elements and inside the curly bracket is the declaration block. </h3>
    <h5> Dikh rha hu kya mai bhi ?</h5>
    <h4> U can add css through separate file as well as u can include it directly in the html file. </h4>

</body>
</html>
