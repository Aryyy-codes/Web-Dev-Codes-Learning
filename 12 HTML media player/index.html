<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Media player Exercise</title>
</head>
<body>
   
    <table>
        <tr>
            <th><img src="Image.jpg" width="300" alt="Description of the image"></th>
            <th><div><audio controls src="O Sahib.mp3" muted ></audio></div></th>
            <th><video src="video.mp4" controls width="300" poster="Screenshot 2026-06-03 201428.png" muted></video></th>
        </tr>
        <tr>
            <td><img src="Image.jpg" width="300" alt="Description of the image"></td>
            <td><audio controls src="O Sahib.mp3" muted ></audio></td>
            <td><video src="video.mp4" controls width="300" poster="Screenshot 2026-06-03 201428.png" muted></video></td>
        </tr>
    </table>

    <ol>
        <li><img src="Image.jpg" width="100" alt="Description of the image"></li>
        <li><audio controls src="O Sahib.mp3" muted ></audio></li>
        <li><video src="video.mp4" controls width="100" poster="Screenshot 2026-06-03 201428.png" muted></video></li>
    </ol>
       
</body>
</html>
