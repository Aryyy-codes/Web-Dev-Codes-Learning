<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 320px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
            /* z-index: 1 ;
            z-index tells us which element will overlap against which one, higher the z index - more the priority the element will get for overlap visibility. */
        }
        
        /* Position is always static for the box element here and to make any changes to it, we will have to change its position property to relative or absolute. */

        .box1 {
            background-color: aqua;
            /* position: sticky;
            position: sticky is used to position an element based on the user's scroll position. A sticky element toggles between relative and fixed, depending on the scroll position. It is positioned relative until a given offset position is met in the viewport - then it "sticks" in place (like position:fixed). */

            /*
            top:0px;
            height: 111px;
            width:100%;
            margin: 0;
            padding: 0; */
            position: absolute;
            /* Position absolute is used to position an element relative to its first positioned (not static) ancestor element. Like it will check for which parent isn't static and then positio itself relative to that parent. If all the parents are static, then it will position itself relative to the initial containing block (usually the viewport). */
            top: 0px;
            left:3px;
        }

        .box2 {
            background-color: azure;
            position: relative;
            /* Position relative is used to position an element relative to its normal position. So, if you set the top property to 20px, the element will move down 20px from where it would normally be in the document flow. */
            top: 34px;
            left: 56px;
        }

        .box3 {
            background-color: antiquewhite;
            position: fixed;
            /* Position fixed is used to position an element relative to the viewport, which means it always stays in the same place even if the page is scrolled. The top, right, bottom, and left properties are used to position the element. */
            bottom: 0px;
            left:8vw;
            height: 111px;
        }

        .box4 {
            background-color: purple;
        }

      

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            
            /* position: relative; */


            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"> 
            Position is always static for the box element here and to make any changes to it, we will have to change its position property to relative or absolute. And then u can use z-index to make it appear on top of other elements.
            
        </div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
