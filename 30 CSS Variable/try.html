<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    :root {
        --primary-color: #3498db;
        --secondary-color: #2ecc71;
        --opacity_1: 0.8;
        --opacity_2: 0.4;
    }
        h2:first-child {
            color: var(--primary-color);
            opacity: var(--opacity_1);
        }
        h2:nth-child(2) {
            color: var(--secondary-color);
            opacity: var(--opacity_2);
        }
        </style>
</head>
<body>
    <h2>
        This is a heading with primary color and opacity of 0.8
    </h2>
    <h2>
        This is a heading with secondary color and opacity of 0.8
    </h2>
</body>
</html>
